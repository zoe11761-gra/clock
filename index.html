<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>出勤紀錄</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+TC:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream:       #F8F4EF;
    --cream2:      #F0EAE1;
    --warm-white:  #FDFAF7;
    --taupe:       #C8B89A;
    --sand:        #A8927A;
    --espresso:    #3D2B1F;
    --copper:      #9B6A3E;
    --copper-light:#C49A6C;
    --mist:        #E8E0D6;
    --red-out:     #B85450;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--cream);
    color: var(--espresso);
    font-family: 'Noto Serif TC', serif;
    min-height: 100vh;
    padding: 0 0 80px;
  }

  /* ── 頂部標題 ── */
  header {
    background: var(--warm-white);
    border-bottom: 1px solid var(--taupe);
    padding: 28px 24px 20px;
    position: sticky; top: 0; z-index: 100;
  }
  .header-row {
    display: flex; justify-content: space-between; align-items: flex-end;
  }
  .header-title {
    font-family: 'EB Garamond', serif;
    font-size: 28px; font-weight: 500;
    color: var(--espresso); letter-spacing: 0.02em;
  }
  .header-sub {
    font-size: 12px; color: var(--sand);
    margin-top: 4px; letter-spacing: 0.05em;
  }
  .month-badge {
    font-family: 'EB Garamond', serif;
    font-size: 13px; font-style: italic;
    color: var(--copper); padding: 6px 14px;
    border: 1px solid var(--taupe);
    border-radius: 20px; background: var(--cream);
  }

  /* ── 今日狀態卡 ── */
  .today-card {
    margin: 20px 20px 0;
    background: var(--warm-white);
    border: 1px solid var(--taupe);
    border-radius: 16px;
    padding: 24px 24px 20px;
  }
  .today-date {
    font-family: 'EB Garamond', serif;
    font-size: 13px; font-style: italic;
    color: var(--sand); margin-bottom: 16px;
    letter-spacing: 0.06em;
  }
  .punch-row {
    display: flex; gap: 12px; margin-bottom: 16px;
  }
  .punch-item {
    flex: 1;
    background: var(--cream); border: 1px solid var(--mist);
    border-radius: 10px; padding: 14px 16px;
    text-align: center;
  }
  .punch-label {
    font-size: 10px; color: var(--sand);
    letter-spacing: 0.1em; text-transform: uppercase;
    margin-bottom: 6px;
  }
  .punch-time {
    font-family: 'EB Garamond', serif;
    font-size: 24px; font-weight: 500;
    color: var(--espresso); letter-spacing: 0.02em;
  }
  .punch-time.has-time { color: var(--copper); }
  .punch-time.empty { color: var(--taupe); font-size: 18px; }

  .hours-row {
    display: flex; align-items: center; justify-content: center;
    gap: 8px; padding: 10px 0 4px;
    border-top: 1px solid var(--mist);
  }
  .hours-label { font-size: 11px; color: var(--sand); letter-spacing: 0.06em; }
  .hours-val {
    font-family: 'EB Garamond', serif;
    font-size: 20px; font-weight: 600; color: var(--copper);
  }

  /* ── 打卡按鈕 ── */
  .btn-row {
    display: flex; gap: 12px; margin: 16px 20px 0;
  }
  .btn {
    flex: 1; padding: 18px 0;
    border: none; border-radius: 14px;
    font-family: 'Noto Serif TC', serif;
    font-size: 15px; font-weight: 500;
    cursor: pointer; transition: all 0.18s ease;
    letter-spacing: 0.06em;
  }
  .btn-in {
    background: var(--espresso); color: var(--warm-white);
  }
  .btn-in:active { transform: scale(0.97); background: #2a1e15; }
  .btn-out {
    background: var(--warm-white); color: var(--espresso);
    border: 1.5px solid var(--taupe);
  }
  .btn-out:active { transform: scale(0.97); background: var(--cream2); }
  .btn:disabled {
    opacity: 0.35; cursor: default; transform: none !important;
  }

  /* ── 區塊標題 ── */
  .section-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 28px 24px 12px;
  }
  .section-title {
    font-family: 'EB Garamond', serif;
    font-size: 16px; font-style: italic; color: var(--sand);
    letter-spacing: 0.04em;
  }
  .section-action {
    font-size: 12px; color: var(--copper);
    text-decoration: none; cursor: pointer;
    border: none; background: none;
    font-family: 'Noto Serif TC', serif;
    letter-spacing: 0.04em;
  }

  /* ── 月曆 ── */
  .calendar-wrap { padding: 0 20px; }
  .cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .cal-dow {
    text-align: center; padding: 8px 0 10px;
    font-size: 10px; color: var(--sand);
    letter-spacing: 0.12em;
  }
  .cal-dow.we { color: var(--copper-light); }

  .cal-cell {
    background: var(--warm-white);
    border: 1px solid var(--mist);
    border-radius: 10px; padding: 8px 6px 6px;
    text-align: right; min-height: 56px;
    display: flex; flex-direction: column;
    justify-content: space-between;
    transition: border-color 0.15s;
  }
  .cal-cell.other { background: transparent; border-color: transparent; }
  .cal-cell.weekend { background: var(--cream2); }
  .cal-cell.has-data {
    border-color: var(--copper-light);
    background: #FEFCF9;
  }
  .cal-cell.today-cell {
    border-color: var(--copper);
    border-width: 2px;
  }
  .cal-num {
    font-family: 'EB Garamond', serif;
    font-size: 15px; font-weight: 500; color: var(--espresso);
  }
  .cal-cell.other .cal-num { color: var(--taupe); }
  .cal-cell.weekend .cal-num { color: var(--sand); }
  .cal-cell.has-data .cal-num { color: var(--copper); }
  .cal-cell.today-cell .cal-num { color: var(--copper); font-weight: 600; }
  .cal-hours {
    font-family: 'EB Garamond', serif;
    font-size: 13px; color: var(--copper-light);
    text-align: center; font-weight: 600;
    align-self: center; width: 100%;
    margin-top: 2px;
  }

  /* ── 月統計帶 ── */
  .month-stat {
    margin: 12px 20px 0;
    background: var(--warm-white);
    border: 1px solid var(--taupe);
    border-radius: 12px; padding: 14px 20px;
    display: flex; justify-content: space-around;
  }
  .stat-item { text-align: center; }
  .stat-num {
    font-family: 'EB Garamond', serif;
    font-size: 22px; font-weight: 600; color: var(--copper);
  }
  .stat-lbl { font-size: 10px; color: var(--sand); margin-top: 2px; letter-spacing: 0.08em; }

  /* ── 流水明細列表 ── */
  .records-wrap { padding: 0 20px; display: flex; flex-direction: column; gap: 8px; }
  .record-item {
    background: var(--warm-white);
    border: 1px solid var(--mist);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color 0.15s;
  }
  .record-item:has(.action-bar.open) { border-color: var(--copper-light); }
  .record-main-row {
    padding: 14px 18px;
    display: flex; align-items: center; gap: 14px;
    cursor: pointer; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .record-main-row:active { background: var(--cream); }
  .record-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--copper); flex-shrink: 0;
    margin-top: 2px;
  }
  .record-main { flex: 1; }
  .record-date {
    font-size: 13px; color: var(--espresso);
    font-weight: 500; letter-spacing: 0.02em;
  }
  .record-times {
    font-size: 12px; color: var(--sand);
    margin-top: 3px; letter-spacing: 0.04em;
  }
  .record-hrs {
    font-family: 'EB Garamond', serif;
    font-size: 18px; font-weight: 600; color: var(--copper);
    letter-spacing: 0.02em;
  }
  .record-chevron {
    font-size: 10px; color: var(--taupe);
    transition: transform 0.2s; margin-left: 4px;
  }
  .record-item:has(.action-bar.open) .record-chevron { transform: rotate(180deg); }

  /* 展開操作列 */
  .action-bar {
    display: none; border-top: 1px solid var(--mist);
    padding: 12px 18px; gap: 8px;
    flex-direction: row;
    background: var(--cream);
    animation: slideDown 0.18s ease;
  }
  .action-bar.open { display: flex; }
  @keyframes slideDown {
    from { opacity:0; transform:translateY(-6px); }
    to   { opacity:1; transform:translateY(0); }
  }
  .act-btn {
    flex: 1; padding: 10px 0;
    border-radius: 8px; border: none;
    font-family: 'Noto Serif TC', serif;
    font-size: 13px; cursor: pointer;
    letter-spacing: 0.04em; transition: opacity 0.15s;
  }
  .act-btn:active { opacity: 0.7; }
  .act-edit {
    background: var(--warm-white);
    border: 1px solid var(--taupe);
    color: var(--espresso);
  }
  .act-del {
    background: #FAF0EE;
    border: 1px solid #D4A09A;
    color: #9B3A35;
  }

  /* 刪除確認 */
  .del-confirm {
    display: none; border-top: 1px solid var(--mist);
    padding: 14px 18px; background: #FDF5F4;
    animation: slideDown 0.18s ease;
  }
  .del-confirm.open { display: block; }
  .del-msg {
    font-size: 13px; color: #9B3A35;
    margin-bottom: 12px; letter-spacing: 0.02em;
  }
  .del-btns { display: flex; gap: 8px; }
  .del-cancel {
    flex:1; padding:10px; border-radius:8px;
    background: var(--warm-white); border:1px solid var(--taupe);
    font-family:'Noto Serif TC',serif; font-size:13px;
    color:var(--sand); cursor:pointer;
  }
  .del-ok {
    flex:1; padding:10px; border-radius:8px;
    background:#9B3A35; border:none;
    font-family:'Noto Serif TC',serif; font-size:13px;
    color:#fff; cursor:pointer;
  }

  /* ── 補打卡 Modal ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(61,43,31,0.45);
    backdrop-filter: blur(4px);
    display: flex; align-items: flex-end;
    z-index: 200; opacity: 0; pointer-events: none;
    transition: opacity 0.25s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--warm-white);
    border-radius: 24px 24px 0 0;
    padding: 28px 24px 48px;
    width: 100%;
    transform: translateY(30px);
    transition: transform 0.3s cubic-bezier(0.16,1,0.3,1);
  }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal-title {
    font-family: 'EB Garamond', serif;
    font-size: 20px; font-style: italic; color: var(--espresso);
    margin-bottom: 24px; text-align: center;
  }
  .form-group { margin-bottom: 18px; }
  .form-label {
    font-size: 11px; color: var(--sand);
    letter-spacing: 0.1em; display: block; margin-bottom: 8px;
  }
  .form-input {
    width: 100%; padding: 14px 16px;
    background: var(--cream); border: 1px solid var(--taupe);
    border-radius: 10px; font-size: 16px;
    font-family: 'Noto Serif TC', serif;
    color: var(--espresso); outline: none;
    -webkit-appearance: none;
  }
  .form-input:focus { border-color: var(--copper); }
  .form-row { display: flex; gap: 12px; }
  .form-row .form-group { flex: 1; }
  .modal-btn-row { display: flex; gap: 12px; margin-top: 8px; }
  .modal-cancel {
    flex: 1; padding: 16px; border: 1.5px solid var(--taupe);
    background: transparent; border-radius: 12px;
    font-family: 'Noto Serif TC', serif; font-size: 14px;
    color: var(--sand); cursor: pointer;
  }
  .modal-confirm {
    flex: 2; padding: 16px;
    background: var(--espresso); border: none;
    border-radius: 12px; font-family: 'Noto Serif TC', serif;
    font-size: 14px; color: var(--warm-white); cursor: pointer;
    letter-spacing: 0.06em;
  }

  /* ── 吐司提示 ── */
  .toast {
    position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
    background: var(--espresso); color: var(--warm-white);
    padding: 12px 24px; border-radius: 24px;
    font-size: 13px; letter-spacing: 0.04em;
    opacity: 0; transition: opacity 0.3s;
    pointer-events: none; white-space: nowrap; z-index: 300;
  }
  .toast.show { opacity: 1; }

  /* ── Tab 切換 ── */
  .tabs {
    display: flex; gap: 0;
    margin: 24px 20px 0;
    background: var(--cream2);
    border-radius: 12px; padding: 4px;
  }
  .tab {
    flex: 1; padding: 10px 0;
    border: none; background: transparent;
    font-family: 'Noto Serif TC', serif;
    font-size: 13px; color: var(--sand);
    border-radius: 9px; cursor: pointer;
    transition: all 0.2s; letter-spacing: 0.04em;
  }
  .tab.active {
    background: var(--warm-white);
    color: var(--espresso); font-weight: 500;
    box-shadow: 0 1px 4px rgba(61,43,31,0.1);
  }
  .panel { display: none; }
  .panel.active { display: block; }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div>
      <div class="header-title">出勤紀錄</div>
      <div class="header-sub" id="headerSub">載入中…</div>
    </div>
    <div class="month-badge" id="monthBadge">—</div>
  </div>
</header>

<!-- 今日狀態卡 -->
<div class="today-card">
  <div class="today-date" id="todayDate">—</div>
  <div class="punch-row">
    <div class="punch-item">
      <div class="punch-label">進入</div>
      <div class="punch-time empty" id="dispIn">——</div>
    </div>
    <div class="punch-item">
      <div class="punch-label">離開</div>
      <div class="punch-time empty" id="dispOut">——</div>
    </div>
  </div>
  <div class="hours-row">
    <div class="hours-label">今日工時</div>
    <div class="hours-val" id="dispHours">—</div>
    <div class="hours-label">h</div>
  </div>
</div>

<!-- 打卡按鈕 -->
<div class="btn-row">
  <button class="btn btn-in"  id="btnIn"  onclick="punch('in')">▶ 抵達打卡</button>
  <button class="btn btn-out" id="btnOut" onclick="punch('out')">◀ 離開打卡</button>
</div>

<!-- Tab -->
<div class="tabs">
  <button class="tab active" onclick="switchTab('cal',this)">月曆總表</button>
  <button class="tab"        onclick="switchTab('log',this)">流水明細</button>
</div>

<!-- 月曆面板 -->
<div class="panel active" id="panel-cal">
  <div class="section-head">
    <div class="section-title" id="calTitle">五月 2026</div>
    <button class="section-action" onclick="openModal()">＋ 補打卡</button>
  </div>
  <div class="calendar-wrap">
    <div class="cal-grid" id="calGrid"></div>
  </div>
  <div class="month-stat">
    <div class="stat-item">
      <div class="stat-num" id="statDays">0</div>
      <div class="stat-lbl">出勤天數</div>
    </div>
    <div class="stat-item">
      <div class="stat-num" id="statTotal">0.0</div>
      <div class="stat-lbl">總工時 h</div>
    </div>
    <div class="stat-item">
      <div class="stat-num" id="statAvg">0.0</div>
      <div class="stat-lbl">日均 h</div>
    </div>
  </div>
</div>

<!-- 流水明細面板 -->
<div class="panel" id="panel-log">
  <div class="section-head">
    <div class="section-title">明細紀錄</div>
    <button class="section-action" onclick="exportCSV()">匯出 CSV</button>
  </div>
  <div class="records-wrap" id="recordsList"></div>
</div>

<!-- 補打卡 Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
  <div class="modal">
    <div class="modal-title" id="modalTitle">補打卡紀錄</div>
    <input type="hidden" id="mOrigDate">
    <div class="form-group">
      <label class="form-label">日期</label>
      <input type="date" class="form-input" id="mDate">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">進入時間</label>
        <input type="time" class="form-input" id="mIn">
      </div>
      <div class="form-group">
        <label class="form-label">離開時間</label>
        <input type="time" class="form-input" id="mOut">
      </div>
    </div>
    <div class="modal-btn-row">
      <button class="modal-cancel" onclick="closeModal()">取消</button>
      <button class="modal-confirm" onclick="saveManual()">儲存紀錄</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── 資料結構 ──────────────────────────────────────────────
const STORE_KEY = 'attendance_v1';

function loadData() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
  catch { return {}; }
}
function saveData(d) { localStorage.setItem(STORE_KEY, JSON.stringify(d)); }

function todayKey() {
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
}
function fmtTime(d) {
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function calcHours(inT, outT) {
  const [ih,im] = inT.split(':').map(Number);
  const [oh,om] = outT.split(':').map(Number);
  return Math.max(0, (oh*60+om - ih*60-im) / 60);
}

// ── 初始化 ────────────────────────────────────────────────
const DOW_CN = ['日','一','二','三','四','五','六'];
const MONTHS_EN = ['January','February','March','April','May','June',
                   'July','August','September','October','November','December'];

function init() {
  const now = new Date();
  const tk = todayKey();
  const data = loadData();
  const today = data[tk] || {};

  // 標題
  document.getElementById('headerSub').textContent =
    `${now.getFullYear()} 年 ${now.getMonth()+1} 月`;
  document.getElementById('monthBadge').textContent =
    `${MONTHS_EN[now.getMonth()].slice(0,3)} ${now.getFullYear()}`;
  document.getElementById('todayDate').textContent =
    `${now.getMonth()+1} 月 ${now.getDate()} 日　星期${DOW_CN[now.getDay()]}`;
  document.getElementById('calTitle').textContent =
    `${now.getMonth()+1} 月 ${now.getFullYear()}`;

  // 今日顯示
  updateTodayDisplay(today);
  renderCalendar(now.getFullYear(), now.getMonth());
  renderLog();
}

function updateTodayDisplay(today) {
  const inEl  = document.getElementById('dispIn');
  const outEl = document.getElementById('dispOut');
  const hrsEl = document.getElementById('dispHours');

  if (today.in) {
    inEl.textContent = today.in;
    inEl.className = 'punch-time has-time';
  } else {
    inEl.textContent = '——';
    inEl.className = 'punch-time empty';
  }
  if (today.out) {
    outEl.textContent = today.out;
    outEl.className = 'punch-time has-time';
  } else {
    outEl.textContent = '——';
    outEl.className = 'punch-time empty';
  }
  if (today.in && today.out) {
    hrsEl.textContent = calcHours(today.in, today.out).toFixed(1);
  } else {
    hrsEl.textContent = '—';
  }

  document.getElementById('btnIn').disabled  = !!today.in;
  document.getElementById('btnOut').disabled = !today.in || !!today.out;
}

// ── 打卡動作 ──────────────────────────────────────────────
function punch(type) {
  const tk = todayKey();
  const data = loadData();
  if (!data[tk]) data[tk] = {};
  const t = fmtTime(new Date());
  data[tk][type === 'in' ? 'in' : 'out'] = t;
  saveData(data);
  updateTodayDisplay(data[tk]);
  renderCalendar(new Date().getFullYear(), new Date().getMonth());
  renderLog();
  showToast(type === 'in' ? `▶ 抵達打卡  ${t}` : `◀ 離開打卡  ${t}`);
}

// ── 月曆渲染 ──────────────────────────────────────────────
function renderCalendar(year, month) {
  const data = loadData();
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  const DOW_LABELS = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  DOW_LABELS.forEach((d,i) => {
    const el = document.createElement('div');
    el.className = 'cal-dow' + (i===0||i===6?' we':'');
    el.textContent = d;
    grid.appendChild(el);
  });

  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const daysInPrev  = new Date(year, month, 0).getDate();
  const todayD = new Date().getDate();
  const todayM = new Date().getMonth();
  const todayY = new Date().getFullYear();

  let totalDays = 0, totalHours = 0;
  // 統計本月
  for (let d = 1; d <= daysInMonth; d++) {
    const k = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const rec = data[k];
    if (rec && rec.in && rec.out) {
      totalDays++;
      totalHours += calcHours(rec.in, rec.out);
    }
  }

  // 上月填充
  for (let i = 0; i < firstDay; i++) {
    const el = document.createElement('div');
    el.className = 'cal-cell other';
    const num = document.createElement('div');
    num.className = 'cal-num';
    num.textContent = daysInPrev - firstDay + 1 + i;
    el.appendChild(num);
    grid.appendChild(el);
  }

  // 本月
  for (let d = 1; d <= daysInMonth; d++) {
    const k = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const rec = data[k] || {};
    const dow = (firstDay + d - 1) % 7;
    const isWE = dow === 0 || dow === 6;
    const isToday = d===todayD && month===todayM && year===todayY;
    const hasData = rec.in && rec.out;

    const el = document.createElement('div');
    el.className = 'cal-cell'
      + (isWE ? ' weekend' : '')
      + (hasData ? ' has-data' : '')
      + (isToday ? ' today-cell' : '');

    const num = document.createElement('div');
    num.className = 'cal-num';
    num.textContent = d;
    el.appendChild(num);

    if (hasData) {
      const hrs = document.createElement('div');
      hrs.className = 'cal-hours';
      hrs.textContent = calcHours(rec.in, rec.out).toFixed(1) + 'h';
      el.appendChild(hrs);
    }
    grid.appendChild(el);
  }

  // 補下月
  const total = firstDay + daysInMonth;
  const remain = (7 - total % 7) % 7;
  for (let i = 1; i <= remain; i++) {
    const el = document.createElement('div');
    el.className = 'cal-cell other';
    const num = document.createElement('div');
    num.className = 'cal-num';
    num.textContent = i;
    el.appendChild(num);
    grid.appendChild(el);
  }

  // 統計
  document.getElementById('statDays').textContent = totalDays;
  document.getElementById('statTotal').textContent = totalHours.toFixed(1);
  document.getElementById('statAvg').textContent =
    totalDays ? (totalHours / totalDays).toFixed(1) : '0.0';
}

// ── 流水明細 ──────────────────────────────────────────────
function renderLog() {
  const data = loadData();
  const list = document.getElementById('recordsList');
  const sorted = Object.entries(data).sort((a,b) => b[0].localeCompare(a[0]));
  list.innerHTML = '';
  if (sorted.length === 0) {
    list.innerHTML = '<div style="text-align:center;padding:40px 0;color:var(--taupe);font-size:14px;font-style:italic;">尚無紀錄</div>';
    return;
  }
  sorted.forEach(([k, rec]) => {
    const [y,m,d] = k.split('-');
    const dow = new Date(+y,+m-1,+d).getDay();
    const hrs = (rec.in && rec.out) ? calcHours(rec.in, rec.out).toFixed(1) : '—';

    const item = document.createElement('div');
    item.className = 'record-item';
    item.innerHTML = `
      <div class="record-main-row" onclick="toggleAction(this)">
        <div class="record-dot"></div>
        <div class="record-main">
          <div class="record-date">${m}/${d}　星期${DOW_CN[dow]}</div>
          <div class="record-times">${rec.in||'—'} → ${rec.out||'—'}</div>
        </div>
        <div class="record-hrs">${hrs}<span style="font-size:12px;color:var(--sand);font-weight:400">h</span></div>
        <div class="record-chevron">▼</div>
      </div>
      <div class="action-bar">
        <button class="act-btn act-edit" onclick="editRecord('${k}')">✎ 修改</button>
        <button class="act-btn act-del"  onclick="showDelConfirm(this)">✕ 刪除</button>
      </div>
      <div class="del-confirm">
        <div class="del-msg">確定刪除 ${m}/${d} 的打卡紀錄？</div>
        <div class="del-btns">
          <button class="del-cancel" onclick="hideDelConfirm(this)">取消</button>
          <button class="del-ok"     onclick="deleteRecord('${k}')">確定刪除</button>
        </div>
      </div>
    `;
    list.appendChild(item);
  });
}

function toggleAction(row) {
  const bar = row.nextElementSibling;
  const delC = bar.nextElementSibling;
  const isOpen = bar.classList.contains('open');
  // 先關閉所有
  document.querySelectorAll('.action-bar.open').forEach(b => b.classList.remove('open'));
  document.querySelectorAll('.del-confirm.open').forEach(b => b.classList.remove('open'));
  if (!isOpen) bar.classList.add('open');
}

function showDelConfirm(btn) {
  const bar = btn.closest('.action-bar');
  bar.classList.remove('open');
  bar.nextElementSibling.classList.add('open');
}
function hideDelConfirm(btn) {
  btn.closest('.del-confirm').classList.remove('open');
}

function deleteRecord(key) {
  const data = loadData();
  delete data[key];
  saveData(data);
  const now = new Date();
  renderCalendar(now.getFullYear(), now.getMonth());
  renderLog();
  if (key === todayKey()) updateTodayDisplay({});
  showToast('已刪除該筆紀錄');
}

function editRecord(key) {
  const data = loadData();
  const rec = data[key] || {};
  document.getElementById('modalTitle').textContent = '修改打卡紀錄';
  document.getElementById('mOrigDate').value = key;
  document.getElementById('mDate').value = key;
  document.getElementById('mIn').value  = rec.in  || '';
  document.getElementById('mOut').value = rec.out || '';
  document.getElementById('modalOverlay').classList.add('open');
}

// ── 補打卡 / 編輯 Modal ───────────────────────────────────
function openModal() {
  document.getElementById('modalTitle').textContent = '補打卡紀錄';
  document.getElementById('mOrigDate').value = '';
  document.getElementById('mDate').value = todayKey();
  document.getElementById('mIn').value = '';
  document.getElementById('mOut').value = '';
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}
function closeModalOutside(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}
function saveManual() {
  const date    = document.getElementById('mDate').value;
  const inT     = document.getElementById('mIn').value;
  const outT    = document.getElementById('mOut').value;
  const origKey = document.getElementById('mOrigDate').value;
  if (!date) { showToast('請選擇日期'); return; }
  if (inT && outT && calcHours(inT, outT) <= 0) {
    showToast('離開時間需晚於進入時間'); return;
  }
  const data = loadData();
  // 若改了日期，刪除舊 key
  if (origKey && origKey !== date) delete data[origKey];
  if (!data[date]) data[date] = {};
  if (inT)  data[date].in  = inT;
  if (outT) data[date].out = outT;
  saveData(data);
  closeModal();
  const now = new Date();
  renderCalendar(now.getFullYear(), now.getMonth());
  renderLog();
  if (date === todayKey() || origKey === todayKey()) updateTodayDisplay(data[date]||{});
  showToast(origKey ? '✓ 紀錄已修改' : '✓ 補打卡已儲存');
}

// ── 匯出 CSV ──────────────────────────────────────────────
function exportCSV() {
  const data = loadData();
  const rows = [['日期','星期','進入','離開','工時(h)']];
  Object.entries(data).sort().forEach(([k,rec]) => {
    const [y,m,d] = k.split('-');
    const dow = DOW_CN[new Date(+y,+m-1,+d).getDay()];
    const hrs = (rec.in&&rec.out) ? calcHours(rec.in,rec.out).toFixed(2) : '';
    rows.push([`${y}/${m}/${d}`, dow, rec.in||'', rec.out||'', hrs]);
  });
  const csv = '\uFEFF' + rows.map(r=>r.join(',')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = `出勤紀錄_${new Date().getMonth()+1}月.csv`;
  a.click();
}

// ── Tab ────────────────────────────────────────────────────
function switchTab(id, btn) {
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('panel-'+id).classList.add('active');
  btn.classList.add('active');
}

// ── Toast ──────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

init();
</script>
